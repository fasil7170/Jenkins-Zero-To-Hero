pipeline {
    agent any
    environment {
        GITHUB_TOKEN = credentials('github-token') // your GitHub token ID in Jenkins
    }
    stages {

        stage('Checkout') {
            steps {
                // Always checkout repo to have a .git directory
                checkout scm
            }
        }

        stage('Build and Test') {
            when {
                expression { return !currentBuild.getBuildCauses('hudson.model.Cause$UpstreamCause')?.any() }
            }
            steps {
                echo "Build and Test steps go here"
            }
        }

        stage('Static Code Analysis') {
            when {
                expression { return !currentBuild.getBuildCauses('hudson.model.Cause$UpstreamCause')?.any() }
            }
            steps {
                echo "Static analysis steps go here"
            }
        }

        stage('Build and Push Docker Image') {
            when {
                expression { return !currentBuild.getBuildCauses('hudson.model.Cause$UpstreamCause')?.any() }
            }
            steps {
                echo "Docker build and push steps go here"
            }
        }

        stage('Update Deployment File') {
            steps {
                // Ensure repo exists even if pipeline is restarted mid-way
                script {
                    if (!fileExists('.git')) {
                        echo ".git directory missing, checking out repository"
                        checkout scm
                    }
                }
                container('your-container') {
                    sh '''
                    git config user.email "fasilmubarak07@gmail.com"
                    git config user.name "fasil7170"
                    sed -i "s/replaceImageTag/${BUILD_NUMBER}/g" java-maven-sonar-argocd-helm-k8s/spring-boot-app-manifests/deployment.yml
                    git add .
                    git commit -m "Update image to ${BUILD_NUMBER}" || echo "No changes to commit"
                    git push https://${GITHUB_TOKEN}@github.com/fasil7170/Jenkins-Zero-To-Hero HEAD:main
                    '''
                }
            }
        }
    }

    post {
        failure {
            echo "Pipeline failed! Check the logs for errors."
        }
        success {
            echo "Pipeline completed successfully."
        }
    }
}
